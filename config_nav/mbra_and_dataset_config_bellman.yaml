# parameters for MBRA
context_size: 5 #history of image
len_traj_pred: 8 #action length
learn_angle: True
obs_encoder: efficientnet-b0
obs_encoding_size: 1024
late_fusion: False
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4

# parameters for training dataset
image_size: [96, 96] # width, height
context_type: temporal
normalize: True
num_workers: 10

#For GNM dataset
datasets_CAST:
  path: /raid/users/noriaki/CAST_dataset/

datasets_frodobots:
  #root: /nfs/kun2/datasets/frodobots_v1_export
  root: /raid/datasets/frodobots_v1_export
  horizon_short: 20
  horizon_long: 100  
  frodobot:
    train: 11434305
    test: 11434305
    negative_mining: True

datasets_bdd:    
  train: /raid/users/noriaki/data_splits/bdd/train/
  test: /raid/users/noriaki/data_splits/bdd/test/
  image: /nfs/kun2/datasets/bdd100k/BDD_imgs
  pickle: /raid/users/noriaki/BDD_pickle
  backside: False
  aug_seq: False
  only_front: True
  waypoint_spacing: 0.12      
    
datasets_gnm:
  distance:
    min_dist_cat: 0
    max_dist_cat: 20
  action:
    min_dist_cat: 3
    max_dist_cat: 20
  recon:
    data_folder: /nfs/kun2/datasets/gnm_dataset/recon
    train: /raid/users/noriaki/data_splits/recon/train/ # path to train folder with traj_names.txt
    test: /raid/users/noriaki/data_splits/recon/test/ # path to test folder with traj_names.txt
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1 # how many goals are sampled per observation
    negative_mining: True # negative mining from the ViNG paper (Shah et al.)
  go_stanford:
    data_folder: /nfs/kun2/datasets/gnm_dataset/go_stanford_cropped # datasets/stanford_go_new
    train: /raid/users/noriaki/data_splits/go_stanford/train/
    test: /raid/users/noriaki/data_splits/go_stanford/test/
    end_slack: 0
    goals_per_obs: 2 # increase dataset size
    negative_mining: True
  cory_hall:
    data_folder: /nfs/kun2/datasets/gnm_dataset/cory_hall
    train: /raid/users/noriaki/data_splits/cory_hall/train/
    test: /raid/users/noriaki/data_splits/cory_hall/test/
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1
    negative_mining: True
  tartan_drive:
    data_folder: /nfs/kun2/datasets/gnm_dataset/tartan_drive
    train: /raid/users/noriaki/data_splits/tartan_drive/train/
    test: /raid/users/noriaki/data_splits/tartan_drive/test/
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1
    negative_mining: True
  sacson:
    data_folder: /nfs/kun2/datasets/gnm_dataset/sacson
    train: /raid/users/noriaki/data_splits/sacson/train/
    test: /raid/users/noriaki/data_splits/sacson/test/
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1
    negative_mining: True
  seattle:
    data_folder: /nfs/kun2/datasets/gnm_dataset/seattle/
    train: /raid/users/noriaki/data_splits/seattle/train/
    test: /raid/users/noriaki/data_splits/seattle/test/
    end_slack: 0
    goals_per_obs: 1
    negative_mining: True
  scand:
    data_folder: /nfs/kun2/datasets/gnm_dataset/scand/
    train: /raid/users/noriaki/data_splits/scand/train/
    test: /raid/users/noriaki/data_splits/scand/test/
    end_slack: 0
    goals_per_obs: 1
    negative_mining: True
    

